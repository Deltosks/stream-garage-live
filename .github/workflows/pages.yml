name: Publish public monitor
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node --check public/app.js
      - name: Fetch and sanitize public state
        run: npm run sync
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deploy
