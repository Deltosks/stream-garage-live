name: Publish public monitor
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: public-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node --check public/app.js
      - name: Fetch and sanitize public state
        run: npm run sync
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Wait for uploaded artifact to become visible in the API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..15}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -eq 1 ]; then exit 0; fi
            sleep 2
          done
          echo "GitHub did not index the uploaded Pages artifact in time. Keeping the previous deployment."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deploy
